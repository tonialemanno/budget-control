name: Finance CI

on:
  push:
    branches:
      - beta
      - stable
      - "dev/**"
  pull_request:
    branches:
      - beta
      - stable

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find assets/js functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*.mjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Build full ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).version")"
          RELEASE="$(node -p "JSON.parse(require('fs').readFileSync('version.json','utf8')).releaseId")"
          ARCHIVE="finance-v${VERSION}-${GITHUB_REF_NAME}-${RELEASE}.zip"
          zip -r "$ARCHIVE" . -x ".git/*" ".github/*" "payload/*" "*.zip" "runtime-config.local.js" "local-data.sql" "*.backup"
          echo "FINANCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FINANCE_ARCHIVE }}
          path: ${{ env.FINANCE_ARCHIVE }}
          if-no-files-found: error
