<!doctype html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Finance – modularer Finance Core für Privatpersonen und Haushalte.">
  <title>Finance</title>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/forms.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
  <link rel="stylesheet" href="./assets/css/receipt.css">
  <link rel="stylesheet" href="./assets/css/document-preview.css">
</head>
<body>
  <noscript>Diese Anwendung benötigt JavaScript.</noscript>
  <section class="auth-gate" id="authGate" aria-live="polite" style="min-height:100vh;display:grid;place-items:center;padding:24px"><div style="max-width:520px;width:100%;padding:24px;border-radius:20px;background:#fff;color:#111;box-shadow:0 12px 40px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><strong style="display:block;font-size:22px;margin-bottom:8px">Finance</strong><span style="display:block;font-size:15px;line-height:1.5">Finance wird geladen …</span></div></section>

  <div class="app-shell" id="appShell" hidden>
    <aside class="sidebar" aria-label="Hauptnavigation">
      <div class="brand-row">
        <a class="brand" href="#/overview" aria-label="Finance Übersicht">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M7 22.5V9.8c0-1.55 1.25-2.8 2.8-2.8h12.4A2.8 2.8 0 0 1 25 9.8v12.4a2.8 2.8 0 0 1-2.8 2.8H9.8A2.8 2.8 0 0 1 7 22.2Z"/><path d="M11 19.5h10M11 15.8h7M11 12.2h4"/></svg></span>
          <span>Finance</span>
        </a>
        <span class="version-pill" id="releaseVersionPill">V2.3 · STABLE</span>
      </div>
      <nav class="nav-list" id="desktopNav"></nav>
      <div class="sidebar-footer">
        <div class="demo-note"><span class="status-dot status-dot--live" aria-hidden="true"></span><div><strong id="releaseChannelLabel">Stable 2.3</strong><span id="releaseChannelCaption">Echte Daten · Supabase</span></div></div>
        <a class="nav-item nav-item--subtle" href="#/settings" data-route="settings"><span data-icon="settings"></span><span>Einstellungen</span></a>
        <button class="nav-item nav-item--subtle mobile-sidebar-logout" id="mobileLogoutButton" type="button"><span data-icon="log-out"></span><span>Abmelden</span></button>
      </div>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <div class="topbar-title-wrap">
          <button class="icon-button mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Navigation öffnen" aria-expanded="false"><span data-icon="menu"></span></button>
          <div><span class="eyebrow" id="pageEyebrow">Finance Core</span><h1 class="topbar-title" id="pageTitle">Übersicht</h1></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-button privacy-button" id="privacyButton" type="button" aria-label="Finanzwerte verbergen" title="Finanzwerte verbergen"><span data-icon="eye-off"></span></button>
          <button class="icon-button" id="themeButton" type="button" aria-label="Darstellung wechseln" title="Darstellung wechseln"><span data-icon="sun-moon"></span></button>
          <button class="profile-button" id="profileButton" type="button" aria-label="Konto und Zugriff">
            <span class="profile-avatar" id="profileAvatar">F</span>
            <span class="profile-copy"><strong id="profileName">Privat</strong><span id="profileMeta">Finance Core</span></span>
            <span data-icon="chevron-down"></span>
          </button>
        </div>
      </header>
      <section class="page" id="pageContent" aria-live="polite"></section>
    </main>
    <nav class="mobile-tabbar" id="mobileNav" aria-label="Mobile Navigation"></nav>
    <div class="mobile-scrim" id="mobileScrim" hidden></div>
  </div>
  <script src="./runtime-config.js"></script>
  <script src="./assets/js/boot-fallback.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
  <script type="module" src="./assets/js/app/receipt-controller.js"></script>
  <script type="module" src="./assets/js/app/document-preview.js"></script>
</body>
</html>
